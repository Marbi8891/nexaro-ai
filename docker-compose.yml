version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexaro
      POSTGRES_PASSWORD: nexaro_dev
      POSTGRES_DB: nexaroai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexaro -d nexaroai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/code
    working_dir: /code
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://nexaro:nexaro_dev@db:5432/nexaroai
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
